<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Solicitud de Compra — Taller</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #0f1014;
      --surface:   #16181f;
      --border:    #2a2d38;
      --accent:    #f5a623;
      --accent2:   #e05c1a;
      --text:      #e8eaf0;
      --muted:     #6b7080;
      --danger:    #e04545;
      --success:   #3ecf8e;
      --proveedor: #7b61ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      font-weight: 400;
      min-height: 100vh;
      padding: 0 0 60px;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1a1c25 0%, #0f1014 100%);
      border-bottom: 2px solid var(--accent);
      padding: 20px 20px 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-top { display: flex; align-items: center; gap: 12px; }
    .header-icon {
      width: 40px; height: 40px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }
    header h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800; font-size: 22px;
      letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.1;
    }
    header h1 span { color: var(--accent); }
    .header-sub {
      font-size: 11px; color: var(--muted);
      letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px;
    }

    /* ── Main ── */
    main { padding: 20px 16px 0; max-width: 520px; margin: 0 auto; }

    /* ── Section labels ── */
    .section-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700; font-size: 11px;
      letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--accent); margin: 24px 0 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* ── Fields ── */
    .field { margin-bottom: 14px; }
    .field label {
      display: block; font-size: 12px; font-weight: 500;
      color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.07em; margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%; background: var(--surface);
      border: 1.5px solid var(--border); border-radius: 8px;
      color: var(--text); font-family: 'Barlow', sans-serif;
      font-size: 15px; padding: 11px 14px; outline: none;
      transition: border-color .2s, box-shadow .2s; -webkit-appearance: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--accent); box-shadow: 0 0 0 3px rgba(245,166,35,.13);
    }
    .field textarea { resize: vertical; min-height: 80px; }
    .field select option { background: #1e2030; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* ── Urgency pills ── */
    .urgency-group { display: flex; gap: 8px; }
    .urgency-group input[type="radio"] { display: none; }
    .urgency-group label {
      flex: 1; text-align: center; padding: 9px 6px;
      border: 1.5px solid var(--border); border-radius: 8px; cursor: pointer;
      font-size: 13px; font-weight: 600;
      font-family: 'Barlow Condensed', sans-serif;
      letter-spacing: .05em; text-transform: uppercase;
      transition: all .15s; color: var(--muted); margin-bottom: 0;
    }
    #urg-normal:checked ~ label[for="urg-normal"] { border-color: var(--success); color: var(--success); background: rgba(62,207,142,.1); }
    #urg-media:checked  ~ label[for="urg-media"]  { border-color: var(--accent);  color: var(--accent);  background: rgba(245,166,35,.1); }
    #urg-alta:checked   ~ label[for="urg-alta"]   { border-color: var(--danger);  color: var(--danger);  background: rgba(224,69,69,.1); }

    /* ── Item cards ── */
    #items-container { display: flex; flex-direction: column; gap: 10px; }

    .item-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 10px; padding: 14px; position: relative;
      animation: slideIn .2s ease;
      transition: border-color .2s;
    }
    .item-card.is-proveedor { border-color: var(--proveedor); }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .item-card .item-num {
      font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
      font-size: 11px; letter-spacing: .1em; color: var(--accent);
      text-transform: uppercase; margin-bottom: 10px;
    }
    .item-card.is-proveedor .item-num { color: var(--proveedor); }

    .item-card .remove-btn {
      position: absolute; top: 10px; right: 10px;
      background: none; border: none; color: var(--muted);
      font-size: 18px; cursor: pointer; line-height: 1;
      padding: 2px 6px; border-radius: 4px;
      transition: color .15s, background .15s;
    }
    .item-card .remove-btn:hover { color: var(--danger); background: rgba(224,69,69,.1); }

    .item-card input, .item-card select {
      width: 100%; background: var(--bg);
      border: 1.5px solid var(--border); border-radius: 7px;
      color: var(--text); font-family: 'Barlow', sans-serif;
      font-size: 14px; padding: 9px 12px; outline: none;
      -webkit-appearance: none; transition: border-color .2s; margin-bottom: 8px;
    }
    .item-card input:focus, .item-card select:focus { border-color: var(--accent); }
    .item-card .row3 { display: grid; grid-template-columns: 2fr 1fr 1.2fr; gap: 8px; }
    .item-card .row3 input, .item-card .row3 select { margin-bottom: 0; }

    /* ── Tipo toggle (Compra directa / Proveedor) ── */
    .tipo-toggle {
      display: flex; align-items: center; gap: 10px;
      margin-top: 10px; padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .tipo-toggle input[type="checkbox"] { display: none; }
    .tipo-switch {
      position: relative; width: 40px; height: 22px;
      background: var(--border); border-radius: 11px; cursor: pointer;
      transition: background .2s; flex-shrink: 0;
    }
    .tipo-switch::after {
      content: ''; position: absolute;
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--muted); top: 3px; left: 3px;
      transition: transform .2s, background .2s;
    }
    .tipo-checkbox:checked + .tipo-switch { background: rgba(123,97,255,.3); }
    .tipo-checkbox:checked + .tipo-switch::after {
      transform: translateX(18px); background: var(--proveedor);
    }
    .tipo-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px; font-weight: 700; letter-spacing: .05em;
      text-transform: uppercase; color: var(--muted);
      transition: color .2s; user-select: none; cursor: pointer;
    }
    .tipo-label.active-compra  { color: var(--success); }
    .tipo-label.active-proveedor { color: var(--proveedor); }

    /* ── Add item ── */
    #add-item {
      width: 100%; background: transparent;
      border: 1.5px dashed var(--border); border-radius: 10px;
      color: var(--muted); font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700; font-size: 14px; letter-spacing: .07em;
      text-transform: uppercase; padding: 13px; cursor: pointer;
      transition: border-color .2s, color .2s; margin-top: 10px;
    }
    #add-item:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Submit ── */
    #btn-send {
      width: 100%; margin-top: 28px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      border: none; border-radius: 12px; color: #0f1014;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800; font-size: 18px; letter-spacing: .1em;
      text-transform: uppercase; padding: 17px; cursor: pointer;
      transition: opacity .2s, transform .1s;
      box-shadow: 0 4px 20px rgba(245,166,35,.3);
    }
    #btn-send:active { transform: scale(.97); opacity: .9; }

    /* ── Modal ── */
    #modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.75); z-index: 100;
      padding: 20px 16px; overflow-y: auto;
    }
    #modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
    .modal {
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 14px; width: 100%; max-width: 520px;
      padding: 22px; margin: auto;
    }
    .modal h2 {
      font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
      font-size: 18px; letter-spacing: .06em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 6px;
    }
    .modal-subtitle {
      font-size: 12px; color: var(--muted); margin-bottom: 14px;
      letter-spacing: .03em;
    }

    /* Tabs de previsualización */
    .preview-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .preview-tab {
      flex: 1; padding: 8px; border-radius: 7px;
      border: 1.5px solid var(--border);
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700; font-size: 13px; letter-spacing: .05em;
      text-transform: uppercase; cursor: pointer; background: none;
      color: var(--muted); transition: all .15s;
    }
    .preview-tab.active-compra    { border-color: var(--success); color: var(--success); background: rgba(62,207,142,.08); }
    .preview-tab.active-proveedor { border-color: var(--proveedor); color: var(--proveedor); background: rgba(123,97,255,.08); }
    .preview-tab.hidden { display: none; }

    .email-preview {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 14px; font-size: 13px;
      line-height: 1.65; color: #cdd0da; white-space: pre-wrap;
      word-break: break-word; max-height: 45vh; overflow-y: auto;
    }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
    .modal-actions button {
      flex: 1; border-radius: 9px; border: none; padding: 13px;
      font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
      font-size: 15px; letter-spacing: .06em; text-transform: uppercase;
      cursor: pointer; transition: opacity .15s;
    }
    .modal-actions button:active { opacity: .8; }
    #btn-cancel { background: var(--border); color: var(--muted); }
    #btn-confirm-send {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #0f1014;
    }

    /* ── Resumen de envío ── */
    .send-summary {
      display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap;
    }
    .send-badge {
      padding: 5px 12px; border-radius: 20px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase;
    }
    .badge-compra    { background: rgba(62,207,142,.15);  color: var(--success);   border: 1px solid rgba(62,207,142,.3);  }
    .badge-proveedor { background: rgba(123,97,255,.15); color: var(--proveedor); border: 1px solid rgba(123,97,255,.3); }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--success); color: #0f1014;
      font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
      font-size: 15px; letter-spacing: .06em; text-transform: uppercase;
      padding: 12px 24px; border-radius: 30px; z-index: 200;
      transition: transform .35s cubic-bezier(.34,1.56,.64,1);
      white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    .required-star { color: var(--accent); margin-left: 2px; }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="header-icon">🔧</div>
    <div>
      <h1>Solicitud de <span>Compra</span></h1>
      <div class="header-sub">Taller · Material y suministros</div>
    </div>
  </div>
</header>

<main>

  <div class="section-label">Datos generales</div>

  <div class="field">
    <label>Solicitante <span class="required-star">*</span></label>
    <div style="position:relative;">
      <input type="text" id="solicitante" placeholder="Nombre y apellido" autocomplete="name" />
      <div id="saved-hint" style="display:none; font-size:11px; color:var(--success); margin-top:5px; letter-spacing:.04em;">
        ✓ Nombre guardado en este dispositivo · <span id="btn-change-name" style="color:var(--accent);cursor:pointer;text-decoration:underline;">Cambiar</span>
      </div>
    </div>
  </div>

  <div class="row2">
    <div class="field">
      <label>Fecha <span class="required-star">*</span></label>
      <input type="date" id="fecha" />
    </div>
    <div class="field">
      <label>Número de tarea <span class="required-star">*</span></label>
      <input type="text" id="num-pedido" placeholder="Ej: TAREA-0042" />
    </div>
  </div>

  <div class="field">
    <label>Área / Sección</label>
    <select id="area">
      <option value="">— Selecciona área —</option>
      <option>Taller</option>
      <option>Oficina</option>
      <option>Fábrica Inducción</option>
      <option>Fábrica de Hornos</option>
      <option>Generales</option>
      <option>Almacén</option>
      <option>Mantenimiento</option>
      <option>Prevención</option>
      <option>Matricería</option>
      <option>Otros</option>
    </select>
  </div>

  <div class="section-label">Urgencia</div>
  <div class="urgency-group">
    <input type="radio" name="urgencia" id="urg-normal" value="Normal" checked />
    <input type="radio" name="urgencia" id="urg-media" value="Media" />
    <input type="radio" name="urgencia" id="urg-alta" value="Alta — Urgente" />
    <label for="urg-normal">✅ Normal</label>
    <label for="urg-media">⚠️ Media</label>
    <label for="urg-alta">🔴 Urgente</label>
  </div>

  <div class="section-label">Artículos solicitados</div>
  <div id="items-container"></div>
  <button id="add-item" type="button">＋ Añadir artículo</button>

  <div class="section-label">Observaciones</div>
  <div class="field">
    <textarea id="observaciones" placeholder="Notas adicionales, proveedor preferido, referencia de proyecto…"></textarea>
  </div>

  <button id="btn-send" type="button">📧 Previsualizar y enviar correo</button>

</main>

<!-- ── MODAL ── -->
<div id="modal-overlay">
  <div class="modal">
    <h2>📋 Previsualización</h2>
    <p class="modal-subtitle" id="modal-subtitle"></p>
    <div class="send-summary" id="send-summary"></div>
    <div class="preview-tabs" id="preview-tabs"></div>
    <pre class="email-preview" id="email-preview"></pre>
    <div class="modal-actions">
      <button id="btn-cancel">Cancelar</button>
      <button id="btn-confirm-send">Enviar correos</button>
    </div>
  </div>
</div>

<div id="toast">✓ Correos abiertos correctamente</div>

<script>
  const $ = id => document.getElementById(id);

  // ── Correos destino — CONFIGURA AQUÍ ──
  const EMAIL_COMPRA    = 'javier.rubio@bshg.com';
  //const EMAIL_PROVEEDOR = 'proveedores@tuempresa.com';

  // ── Fecha automática ──
  const today = new Date();
  $('fecha').value = today.toISOString().split('T')[0];

  // ── Solicitante persistente ──
  const STORAGE_KEY = 'taller_solicitante';
  const savedName = localStorage.getItem(STORAGE_KEY);
  if (savedName) {
    $('solicitante').value = savedName;
    $('solicitante').readOnly = true;
    $('solicitante').style.opacity = '0.85';
    $('saved-hint').style.display = 'block';
  }
  $('btn-change-name').addEventListener('click', () => {
    $('solicitante').readOnly = false;
    $('solicitante').value = '';
    $('solicitante').style.opacity = '1';
    $('saved-hint').style.display = 'none';
    $('solicitante').focus();
    localStorage.removeItem(STORAGE_KEY);
  });
  $('solicitante').addEventListener('blur', () => {
    const v = $('solicitante').value.trim();
    if (v) {
      localStorage.setItem(STORAGE_KEY, v);
      $('solicitante').readOnly = true;
      $('solicitante').style.opacity = '0.85';
      $('saved-hint').style.display = 'block';
    }
  });

  // ── Gestión de artículos ──
  let itemCount = 0;

  function addItem() {
    itemCount++;
    const n = itemCount;
    const div = document.createElement('div');
    div.className = 'item-card is-proveedor';
    div.id = `item-${n}`;
    div.innerHTML = `
      <div class="item-num" id="item-label-${n}">Artículo ${n} · 🏭 Proveedor</div>
      <button class="remove-btn" onclick="removeItem(${n})" title="Eliminar">✕</button>
      <input type="text" placeholder="Descripción del material *" id="desc-${n}" />
      <div class="row3">
        <input type="number" placeholder="Cant." id="cant-${n}" min="1" value="1" />
        <select id="unidad-${n}">
          <option>Ud.</option>
          <option>m</option>
          <option>kg</option>
          <option>L</option>
          <option>caja</option>
          <option>paq.</option>
          <option>juego</option>
        </select>
        <input type="text" placeholder="Ref. / Código" id="ref-${n}" />
      </div>
      <div class="tipo-toggle">
        <input type="checkbox" class="tipo-checkbox" id="tipo-${n}" onchange="toggleTipo(${n})" />
        <label class="tipo-switch" for="tipo-${n}"></label>
        <label class="tipo-label active-proveedor" id="tipo-label-${n}" for="tipo-${n}">🏭 Proveedor</label>
      </div>
      <select id="prov-${n}" class="prov-select" style="margin-top:8px;">
        <option value="">— Selecciona proveedor —</option>
        <option>ARSAM</option>
        <option>BCN3D</option>
        <option>Bosch Rexroth</option>
        <option>COMPONENTES JLA S.L.</option>
        <option>Comunica-t, s.l.</option>
        <option>Daunert S.A.</option>
        <option>Dinamical 3D</option>
        <option>Essentra</option>
        <option>Gimeno</option>
        <option>Hoffmann-Group</option>
        <option>IMA</option>
        <option>Ineo Prototipos SL</option>
        <option>Insyme, S.L.</option>
        <option>Irpen</option>
        <option>Mainfer</option>
        <option>MINK</option>
        <option>Montajes Alnemar S.L.</option>
        <option>Mouser</option>
        <option>Orpi</option>
        <option>Pariver</option>
        <option>Pincolor</option>
        <option>Poyva</option>
        <option>Quimilock</option>
        <option>Randrade</option>
        <option>Segula</option>
        <option>Sicnova</option>
        <option>Smart Materials 3D</option>
        <option>Technolean</option>
        <option>Tecsa S.A.</option>
        <option>Wurth</option>
        <option>Z3 Rotulos</option>
      </select>
    `;
    $('items-container').appendChild(div);
  }

  function toggleTipo(n) {
    const cb    = $(`tipo-${n}`);
    const card  = $(`item-${n}`);
    const label = $(`tipo-label-${n}`);
    const itemLabel = $(`item-label-${n}`);
    if (cb.checked) {
      card.classList.remove('is-proveedor');
      label.className = 'tipo-label active-compra';
      label.textContent = '🛒 Compra directa';
      itemLabel.textContent = `Artículo ${n} · 🛒 Compra directa`;
      const ps = $(`prov-${n}`); if (ps) ps.style.display = 'none';
    } else {
      card.classList.add('is-proveedor');
      label.className = 'tipo-label active-proveedor';
      label.textContent = '🏭 Proveedor';
      itemLabel.textContent = `Artículo ${n} · 🏭 Proveedor`;
      const ps = $(`prov-${n}`); if (ps) ps.style.display = 'block';
    }
  }

  function removeItem(n) {
    const el = $(`item-${n}`);
    if (el) el.remove();
  }

  $('add-item').addEventListener('click', addItem);
  addItem();

  // ── Recopilar datos ──
  function collectData() {
    const urgencia = document.querySelector('input[name="urgencia"]:checked').value;
    const itemsCompra = [], itemsProveedor = [];

    $('items-container').querySelectorAll('.item-card').forEach(card => {
      const id     = card.id.split('-')[1];
      const desc   = $(`desc-${id}`)?.value.trim()  || '';
      const cant   = $(`cant-${id}`)?.value.trim()  || '1';
      const unidad = $(`unidad-${id}`)?.value       || 'Ud.';
      const ref    = $(`ref-${id}`)?.value.trim()   || '-';
      const esProveedor = $(`tipo-${id}`)?.checked  || false;
      const proveedor   = $(`prov-${id}`)?.value    || '-';
      if (!desc) return;
      const item = { desc, cant, unidad, ref, proveedor };
      if (esProveedor) itemsProveedor.push(item);
      else             itemsCompra.push(item);
    });

    return {
      solicitante:   $('solicitante').value.trim(),
      fecha:         $('fecha').value,
      numPedido:     $('num-pedido').value.trim(),
      area:          $('area').value || 'No especificada',
      urgencia,
      itemsCompra,
      itemsProveedor,
      observaciones: $('observaciones').value.trim() || 'Ninguna'
    };
  }

  // ── Validar ──
  function validate(d) {
    if (!d.solicitante) return 'Por favor, indica el solicitante.';
    if (!d.fecha)       return 'Por favor, selecciona la fecha.';
    if (!d.numPedido)   return 'Por favor, introduce el número de tarea.';
    if (d.itemsCompra.length === 0 && d.itemsProveedor.length === 0)
      return 'Añade al menos un artículo.';
    return null;
  }

  // ── Generar cuerpo de correo ──
  function buildBody(d, tipo) {
    const sep   = '─'.repeat(42);
    const items = tipo === 'compra' ? d.itemsCompra : d.itemsProveedor;
    const titulo = tipo === 'compra'
      ? 'SOLICITUD DE COMPRA DIRECTA — TALLER'
      : 'SOLICITUD A PROVEEDOR — TALLER';

    const itemLines = items.map((it, i) => {
      const provLine = (tipo === 'proveedor' && it.proveedor && it.proveedor !== '-')
        ? `\n      Proveedor: ${it.proveedor}` : '';
      return `  ${String(i+1).padStart(2,'0')}. ${it.desc}\n      Cantidad: ${it.cant} ${it.unidad}   |   Ref: ${it.ref}${provLine}`;
    }).join('\n');

    const jsonData = { ...d, items, tipo };
    delete jsonData.itemsCompra;
    delete jsonData.itemsProveedor;

    return `${titulo}
${sep}

Número de tarea  : ${d.numPedido}
Fecha            : ${d.fecha}
Solicitante      : ${d.solicitante}
Área / Sección   : ${d.area}
Urgencia         : ${d.urgencia}

${sep}
ARTÍCULOS — ${tipo === 'compra' ? 'COMPRA DIRECTA' : 'PROVEEDOR'}
${sep}
${itemLines}

${sep}
OBSERVACIONES
${d.observaciones}

${sep}
[Correo generado automáticamente — procesado por Power Automate]
DATOS_JSON::${JSON.stringify(jsonData)}`;
  }

  // ── Estado del modal ──
  let previewData = null;
  let activeTab   = null;

  function showTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.preview-tab').forEach(b => {
      b.classList.remove('active-compra','active-proveedor');
    });
    const btn = $(`tab-${tab}`);
    if (btn) btn.classList.add(tab === 'compra' ? 'active-compra' : 'active-proveedor');
    $('email-preview').textContent = buildBody(previewData, tab);
  }

  // ── Preview ──
  $('btn-send').addEventListener('click', () => {
    const d   = collectData();
    const err = validate(d);
    if (err) { alert(err); return; }
    previewData = d;

    const tieneCompra    = d.itemsCompra.length > 0;
    const tieneProveedor = d.itemsProveedor.length > 0;

    // Resumen de envío
    const summary = $('send-summary');
    summary.innerHTML = '';
    if (tieneCompra)    summary.innerHTML += `<span class="send-badge badge-compra">🛒 ${d.itemsCompra.length} art. compra directa → ${EMAIL_COMPRA}</span>`;
    if (tieneProveedor) summary.innerHTML += `<span class="send-badge badge-proveedor">🏭 ${d.itemsProveedor.length} art. proveedor → ${EMAIL_PROVEEDOR}</span>`;

    // Tabs
    const tabs = $('preview-tabs');
    tabs.innerHTML = '';
    if (tieneCompra) {
      const b = document.createElement('button');
      b.className = 'preview-tab'; b.id = 'tab-compra';
      b.textContent = '🛒 Compra directa';
      b.onclick = () => showTab('compra');
      tabs.appendChild(b);
    }
    if (tieneProveedor) {
      const b = document.createElement('button');
      b.className = 'preview-tab'; b.id = 'tab-proveedor';
      b.textContent = '🏭 Proveedor';
      b.onclick = () => showTab('proveedor');
      tabs.appendChild(b);
    }

    // Subtítulo y correo activo
    const cuantos = (tieneCompra ? 1 : 0) + (tieneProveedor ? 1 : 0);
    $('modal-subtitle').textContent = cuantos === 2
      ? 'Se enviarán 2 correos independientes'
      : `Se enviará 1 correo a ${tieneCompra ? EMAIL_COMPRA : EMAIL_PROVEEDOR}`;

    // Texto botón
    $('btn-confirm-send').textContent = cuantos === 2 ? 'Enviar 2 correos' : 'Enviar correo';

    showTab(tieneCompra ? 'compra' : 'proveedor');
    $('modal-overlay').classList.add('open');
  });

  $('btn-cancel').addEventListener('click', () => $('modal-overlay').classList.remove('open'));

  $('btn-confirm-send').addEventListener('click', () => {
    const d = previewData;
    $('modal-overlay').classList.remove('open');

    const envios = [];
    if (d.itemsCompra.length > 0)    envios.push({ to: EMAIL_COMPRA,    tipo: 'compra' });
    if (d.itemsProveedor.length > 0) envios.push({ to: EMAIL_PROVEEDOR, tipo: 'proveedor' });

    // Abre los mailto secuencialmente con pequeño retardo para iOS
    envios.forEach((envio, i) => {
      setTimeout(() => {
        const tag     = envio.tipo === 'compra' ? '[COMPRA DIRECTA]' : '[PROVEEDOR]';
        const subject = encodeURIComponent(`${tag} Solicitud ${d.numPedido} — ${d.urgencia}`);
        const body    = encodeURIComponent(buildBody(d, envio.tipo));
        window.location.href = `mailto:${envio.to}?subject=${subject}&body=${body}`;
      }, i * 1200);
    });

    const toast = $('toast');
    toast.textContent = envios.length === 2 ? '✓ 2 correos abiertos' : '✓ Correo abierto';
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  });

  $('modal-overlay').addEventListener('click', e => {
    if (e.target === $('modal-overlay')) $('modal-overlay').classList.remove('open');
  });
</script>
</body>
</html>
