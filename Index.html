<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Solicitud de Compra — Taller</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #0f1014;
      --surface:   #16181f;
      --border:    #2a2d38;
      --accent:    #f5a623;
      --accent2:   #e05c1a;
      --text:      #e8eaf0;
      --muted:     #6b7080;
      --danger:    #e04545;
      --success:   #3ecf8e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      font-weight: 400;
      min-height: 100vh;
      padding: 0 0 60px;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1a1c25 0%, #0f1014 100%);
      border-bottom: 2px solid var(--accent);
      padding: 20px 20px 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-icon {
      width: 40px; height: 40px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    header h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.1;
    }
    header h1 span {
      color: var(--accent);
    }
    .header-sub {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* ── Main ── */
    main { padding: 20px 16px 0; max-width: 520px; margin: 0 auto; }

    /* ── Section labels ── */
    .section-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 24px 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Fields ── */
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 6px;
    }
    .field input,
    .field select,
    .field textarea {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      font-size: 15px;
      padding: 11px 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      -webkit-appearance: none;
    }
    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(245,166,35,.13);
    }
    .field textarea { resize: vertical; min-height: 80px; }
    .field select option { background: #1e2030; }

    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* ── Urgency pills ── */
    .urgency-group {
      display: flex;
      gap: 8px;
    }
    .urgency-group input[type="radio"] { display: none; }
    .urgency-group label {
      flex: 1;
      text-align: center;
      padding: 9px 6px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      font-family: 'Barlow Condensed', sans-serif;
      letter-spacing: .05em;
      text-transform: uppercase;
      transition: all .15s;
      color: var(--muted);
      margin-bottom: 0;
    }
    #urg-normal:checked ~ label[for="urg-normal"]  { border-color: var(--success); color: var(--success); background: rgba(62,207,142,.1); }
    #urg-media:checked  ~ label[for="urg-media"]   { border-color: var(--accent);  color: var(--accent);  background: rgba(245,166,35,.1); }
    #urg-alta:checked   ~ label[for="urg-alta"]    { border-color: var(--danger);  color: var(--danger);  background: rgba(224,69,69,.1); }

    /* ── Líneas de artículo ── */
    #items-container { display: flex; flex-direction: column; gap: 10px; }

    .item-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      position: relative;
      animation: slideIn .2s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .item-card .item-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: .1em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .item-card .remove-btn {
      position: absolute;
      top: 10px; right: 10px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color .15s, background .15s;
    }
    .item-card .remove-btn:hover { color: var(--danger); background: rgba(224,69,69,.1); }

    .item-card input,
    .item-card select {
      width: 100%;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      font-size: 14px;
      padding: 9px 12px;
      outline: none;
      -webkit-appearance: none;
      transition: border-color .2s;
      margin-bottom: 8px;
    }
    .item-card input:focus,
    .item-card select:focus { border-color: var(--accent); }
    .item-card .row3 { display: grid; grid-template-columns: 2fr 1fr 1.2fr; gap: 8px; }
    .item-card .row3 input,
    .item-card .row3 select { margin-bottom: 0; }

    /* ── Add item button ── */
    #add-item {
      width: 100%;
      background: transparent;
      border: 1.5px dashed var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: .07em;
      text-transform: uppercase;
      padding: 13px;
      cursor: pointer;
      transition: border-color .2s, color .2s;
      margin-top: 10px;
    }
    #add-item:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Submit ── */
    #btn-send {
      width: 100%;
      margin-top: 28px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      border: none;
      border-radius: 12px;
      color: #0f1014;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 17px;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
      box-shadow: 0 4px 20px rgba(245,166,35,.3);
    }
    #btn-send:active { transform: scale(.97); opacity: .9; }

    /* ── Preview modal ── */
    #modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 100;
      padding: 20px 16px;
      overflow-y: auto;
    }
    #modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
    .modal {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      width: 100%;
      max-width: 520px;
      padding: 22px;
      margin: auto;
    }
    .modal h2 {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
    }
    #email-preview {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      font-size: 13px;
      line-height: 1.65;
      color: #cdd0da;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 55vh;
      overflow-y: auto;
    }
    .modal-actions {
      display: flex; gap: 10px; margin-top: 16px;
    }
    .modal-actions button {
      flex: 1;
      border-radius: 9px;
      border: none;
      padding: 13px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: .06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity .15s;
    }
    .modal-actions button:active { opacity: .8; }
    #btn-cancel { background: var(--border); color: var(--muted); }
    #btn-confirm-send {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #0f1014;
    }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--success);
      color: #0f1014;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 12px 24px;
      border-radius: 30px;
      z-index: 200;
      transition: transform .35s cubic-bezier(.34,1.56,.64,1);
      white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    .required-star { color: var(--accent); margin-left: 2px; }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="header-icon">🔧</div>
    <div>
      <h1>Solicitud de <span>Compra</span></h1>
      <div class="header-sub">Taller · Material y suministros</div>
    </div>
  </div>
</header>

<main>

  <!-- ── DATOS GENERALES ── -->
  <div class="section-label">Datos generales</div>

  <div class="field">
    <label>Solicitante <span class="required-star">*</span></label>
    <div style="position:relative;">
      <input type="text" id="solicitante" placeholder="Nombre y apellido" autocomplete="name" />
      <div id="saved-hint" style="display:none; font-size:11px; color:var(--success); margin-top:5px; letter-spacing:.04em;">
        ✓ Nombre guardado en este dispositivo · <span id="btn-change-name" style="color:var(--accent);cursor:pointer;text-decoration:underline;">Cambiar</span>
      </div>
    </div>
  </div>

  <div class="row2">
    <div class="field">
      <label>Fecha <span class="required-star">*</span></label>
      <input type="date" id="fecha" />
    </div>
    <div class="field">
      <label>Número de tarea <span class="required-star">*</span></label>
      <input type="text" id="num-pedido" placeholder="Ej: TAREA-0042" />
    </div>
  </div>

  <div class="field">
    <label>Área / Sección</label>
    <select id="area">
      <option value="">— Selecciona área —</option>
      <option>Taller</option>
      <option>Oficina</option>
      <option>Fábrica Inducción</option>
      <option>Fábrica de Hornos</option>
      <option>Generales</option>
      <option>Almacén</option>
      <option>Mantenimiento</option>
      <option>Prevención</option>
      <option>Matricería</option>
      <option>Otros</option>
    </select>
  </div>

  <!-- ── URGENCIA ── -->
  <div class="section-label">Urgencia</div>
  <div class="urgency-group">
    <input type="radio" name="urgencia" id="urg-normal" value="Normal" checked />
    <input type="radio" name="urgencia" id="urg-media" value="Media" />
    <input type="radio" name="urgencia" id="urg-alta" value="Alta — Urgente" />
    <label for="urg-normal">✅ Normal</label>
    <label for="urg-media">⚠️ Media</label>
    <label for="urg-alta">🔴 Urgente</label>
  </div>

  <!-- ── ARTÍCULOS ── -->
  <div class="section-label">Artículos solicitados</div>
  <div id="items-container"></div>
  <button id="add-item" type="button">＋ Añadir artículo</button>

  <!-- ── OBSERVACIONES ── -->
  <div class="section-label">Observaciones</div>
  <div class="field">
    <textarea id="observaciones" placeholder="Notas adicionales, proveedor preferido, referencia de proyecto…"></textarea>
  </div>

  <button id="btn-send" type="button">📧 Previsualizar y enviar correo</button>

</main>

<!-- ── MODAL ── -->
<div id="modal-overlay">
  <div class="modal">
    <h2>📋 Previsualización del correo</h2>
    <pre id="email-preview"></pre>
    <div class="modal-actions">
      <button id="btn-cancel">Cancelar</button>
      <button id="btn-confirm-send">Enviar correo</button>
    </div>
  </div>
</div>

<div id="toast">✓ Correo abierto correctamente</div>

<script>
  /* ── Helpers ── */
  const $ = id => document.getElementById(id);

  /* ── Fecha y número de pedido automáticos ── */
  const today = new Date();
  $('fecha').value = today.toISOString().split('T')[0];
  const pad = n => String(n).padStart(2,'0');

  /* ── Solicitante guardado ── */
  const STORAGE_KEY = 'taller_solicitante';
  const savedName = localStorage.getItem(STORAGE_KEY);
  if (savedName) {
    $('solicitante').value = savedName;
    $('solicitante').readOnly = true;
    $('solicitante').style.color = 'var(--text)';
    $('solicitante').style.opacity = '0.85';
    $('saved-hint').style.display = 'block';
  }
  $('btn-change-name').addEventListener('click', () => {
    $('solicitante').readOnly = false;
    $('solicitante').value = '';
    $('solicitante').style.opacity = '1';
    $('saved-hint').style.display = 'none';
    $('solicitante').focus();
    localStorage.removeItem(STORAGE_KEY);
  });
  // Guardar al perder el foco si hay valor nuevo
  $('solicitante').addEventListener('blur', () => {
    const v = $('solicitante').value.trim();
    if (v) {
      localStorage.setItem(STORAGE_KEY, v);
      $('solicitante').readOnly = true;
      $('solicitante').style.opacity = '0.85';
      $('saved-hint').style.display = 'block';
    }
  });


  let itemCount = 0;

  function addItem() {
    itemCount++;
    const n = itemCount;
    const div = document.createElement('div');
    div.className = 'item-card';
    div.id = `item-${n}`;
    div.innerHTML = `
      <div class="item-num">Artículo ${n}</div>
      <button class="remove-btn" onclick="removeItem(${n})" title="Eliminar">✕</button>
      <input type="text" placeholder="Descripción del material *" id="desc-${n}" />
      <div class="row3">
        <input type="number" placeholder="Cant." id="cant-${n}" min="1" value="1" />
        <select id="unidad-${n}">
          <option>Ud.</option>
          <option>m</option>
          <option>kg</option>
          <option>L</option>
          <option>caja</option>
          <option>paq.</option>
          <option>juego</option>
        </select>
        <input type="text" placeholder="Ref. / Código" id="ref-${n}" />
      </div>
    `;
    $('items-container').appendChild(div);
  }

  function removeItem(n) {
    const el = $(`item-${n}`);
    if (el) el.remove();
  }

  $('add-item').addEventListener('click', addItem);
  addItem(); // Empezar con un artículo

  /* ── Recopilar datos ── */
  function collectData() {
    const urgencia = document.querySelector('input[name="urgencia"]:checked').value;
    const items = [];
    $('items-container').querySelectorAll('.item-card').forEach(card => {
      const id = card.id.split('-')[1];
      const desc  = $(`desc-${id}`)?.value.trim()  || '';
      const cant  = $(`cant-${id}`)?.value.trim()  || '1';
      const unidad= $(`unidad-${id}`)?.value       || 'Ud.';
      const ref   = $(`ref-${id}`)?.value.trim()   || '-';
      if (desc) items.push({ desc, cant, unidad, ref });
    });

    return {
      solicitante: $('solicitante').value.trim(),
      fecha:       $('fecha').value,
      numPedido:   $('num-pedido').value,
      area:        $('area').value || 'No especificada',
      urgencia,
      items,
      observaciones: $('observaciones').value.trim() || 'Ninguna'
    };
  }

  /* ── Validar ── */
  function validate(d) {
    if (!d.solicitante) return 'Por favor, indica el solicitante.';
    if (!d.fecha)       return 'Por favor, selecciona la fecha.';
    if (!d.numPedido)   return 'Por favor, introduce el número de tarea.';
    if (d.items.length === 0) return 'Añade al menos un artículo.';
    return null;
  }

  /* ── Generar cuerpo del correo ── */
  function buildEmailBody(d) {
    const sep  = '─'.repeat(42);
    const itemLines = d.items.map((it, i) =>
      `  ${String(i+1).padStart(2,'0')}. ${it.desc}\n      Cantidad: ${it.cant} ${it.unidad}   |   Ref: ${it.ref}`
    ).join('\n');

    return `SOLICITUD DE COMPRA DE MATERIAL — TALLER
${sep}

Número de tarea  : ${d.numPedido}
Fecha            : ${d.fecha}
Solicitante      : ${d.solicitante}
Área / Sección   : ${d.area}
Urgencia         : ${d.urgencia}

${sep}
ARTÍCULOS SOLICITADOS
${sep}
${itemLines}

${sep}
OBSERVACIONES
${d.observaciones}

${sep}
[Correo generado automáticamente — procesado por Power Automate]
DATOS_JSON::${JSON.stringify(d)}`;
  }

  /* ── Abrir correo ── */
  function openMailto(d) {
    const subject = encodeURIComponent(`[TALLER] Solicitud Compra ${d.numPedido} — ${d.urgencia}`);
    const body    = encodeURIComponent(buildEmailBody(d));
    // ⬇ Cambia esta dirección por la de tu flujo de Power Automate
    const to      = 'javier.rubio@bshg.com';
    window.location.href = `mailto:${to}?subject=${subject}&body=${body}`;
  }

  /* ── Preview ── */
  $('btn-send').addEventListener('click', () => {
    const d = collectData();
    const err = validate(d);
    if (err) { alert(err); return; }
    $('email-preview').textContent = buildEmailBody(d);
    $('modal-overlay').classList.add('open');
  });

  $('btn-cancel').addEventListener('click', () => {
    $('modal-overlay').classList.remove('open');
  });

  $('btn-confirm-send').addEventListener('click', () => {
    const d = collectData();
    $('modal-overlay').classList.remove('open');
    openMailto(d);
    const toast = $('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  });

  $('modal-overlay').addEventListener('click', e => {
    if (e.target === $('modal-overlay')) $('modal-overlay').classList.remove('open');
  });
</script>
</body>
</html>
